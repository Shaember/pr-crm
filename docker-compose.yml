version: "3.9"

services:

  backend:
    build: ./crm-backend
    container_name: crm-backend
    ports:
      - "3000:3000"
    working_dir: /app
    command: node start.js

  frontend:
    build: ./frontend
    container_name: crm-frontend
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0