<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CRM Register</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.card {
    width: 360px;
    background: #111827;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background: #1f2937;
    color: white;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #16a34a;
}

a {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #60a5fa;
    text-decoration: none;
}

.error {
    color: #f87171;
    text-align: center;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="card">
    <h2>CRM Register</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Create account</button>

    <a href="/login.html">Already have account?</a>

    <div id="msg" class="error"></div>
</div>

<script>
async function register() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
        window.location.href = "/login.html";
    } else {
        document.getElementById('msg').innerText = data.error;
    }
}
</script>

</body>
</html>
